<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DEC/O Team</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Droid+Sans:wght@400;700&display=swap" rel="stylesheet">
  
  <style>
body {
  margin: 0;
  padding: 0;
  background: white;
}


    
.person-info {
  font-family: "Droid Sans", Arial, sans-serif;
}

.gallery {
  display: grid;
  grid-template-columns: repeat(6, 1fr);
  gap: 16px;
  width: 100%;
  max-width: 1200px;
  margin: 0 auto;
    box-sizing: border-box;
  padding: 0 4px;
}

    .person {
      position: relative;
      overflow: hidden;
      border-radius: 8px;
      aspect-ratio: 1 / 1;
      background: #ddd;
    }

    .person img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .person-info {
      position: absolute;
      inset: 0;
      background: rgba(0, 0, 0, 0.65);
      color: white;

      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;

      text-align: center;
      padding: 15px;

      opacity: 0;
      transition: opacity 0.25s ease;
    }

    .person:hover .person-info {
      opacity: 1;
    }

    .person-name {
      font-size: 20px;
      font-weight: bold;
      margin-bottom: 6px;
    }

    .person-institution {
      font-size: 15px;
    }

/* Medium screens */
@media (max-width: 900px) {
  .gallery {
    grid-template-columns: repeat(4, 1fr);
  }
}

/* Tablets */
@media (max-width: 650px) {
  .gallery {
    grid-template-columns: repeat(3, 1fr);
  }
}

/* Phones */
@media (max-width: 450px) {
  .gallery {
    grid-template-columns: repeat(2, 1fr);
  }
}


    
  </style>
</head>

<body>


<div class="gallery">

  <div class="person">
    <img src="images/people/luigi-zallio.jpg" alt="Luigi Zallio">
    <div class="person-info">
      <div class="person-name">Luigi Zallio</div>
      <div class="person-institution">ESO</div>
    </div>
  </div>

  <div class="person">
    <img src="images/people/richard-booth.jpg" alt="Richard Booth">
    <div class="person-info">
      <div class="person-name">Richard Booth</div>
      <div class="person-institution">University of Leeds</div>
    </div>
  </div>

  <div class="person">
    <img src="images/people/yuri-aikawa.jpg" alt="Yuri Aikawa">
    <div class="person-info">
      <div class="person-name">Yuri Aikawa</div>
      <div class="person-institution">University of Tokyo</div>
    </div>
  </div>

</div>

</body>
</html>
