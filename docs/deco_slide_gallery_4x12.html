<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; background: #080806; }
  body { font-family: "Droid Sans", Arial, sans-serif; color: #fff; }
  .slide {
    container-type: inline-size;
    margin: 0 auto;
    width: min(100vw, 1920px);
    aspect-ratio: 16 / 9;
    overflow: hidden;
    background: #000;
    padding: 1.4cqw 2cqw 1.2cqw;
    position: relative;
  }
  .slide::before, .slide::after { content: "✦"; position: absolute; color: #c9a348; font-size: 2.3cqw; }
  .slide::before { left: 2cqw; top: 1.4cqw; }
  .slide::after { right: 2cqw; top: 1.4cqw; }
  h1 { font-size: 3.15cqw; line-height: 1.1; margin: 0 0 .7cqw; text-align: center; font-weight: 700; letter-spacing: -.07cqw; }
  .section-label {
    font-size: 1.57cqw; font-weight: 700;
    text-align: center; margin: 0 auto .7cqw;
    display: flex; align-items: center; gap: 1cqw;
    justify-content: center;
  }
  .section-label::before, .section-label::after {
    content: ""; height: .1cqw; background: linear-gradient(90deg, transparent, #d9b64d);
    flex: 1; max-width: 24cqw;
  }
  .section-label::after { transform: rotate(180deg); }
  .copis { display: flex; justify-content: center; gap: 1.1cqw; margin-bottom: 1.05cqw; }
  .portrait { margin: 0; position: relative; min-width: 0; text-align: center; }
  .portrait img { display: block; object-fit: cover; width: 100%; aspect-ratio: 1 / 1; border: .12cqw solid #d6ab32; border-radius: .65cqw; background: #222; }
  .copis .portrait { width: 10.6cqw; }
  figcaption { font-size: .62cqw; line-height: 1.13; padding: .31cqw .08cqw 0; color: #f7ebc0; font-weight: 700; }
  .copis figcaption { font-size: .91cqw; }
  .team-grid { display: grid; grid-template-columns: repeat(12, minmax(0, 1fr)); gap: .65cqw .52cqw; }
  .institution {
    opacity: 0; pointer-events: none; position: absolute; z-index: 5;
    left: 0; right: 0; bottom: 1.2cqw; padding: .6cqw .3cqw;
    font-size: .79cqw; line-height: 1.15; background: rgba(0,0,0,.88);
    color: #fff; border-radius: .25cqw; transition: opacity .15s;
  }
  .portrait:hover .institution, .portrait:focus .institution { opacity: 1; }
  @media print {
    @page { size: 16in 9in; margin: 0; }
    html,body { background: #000; }
    .slide { width: 16in; margin: 0; print-color-adjust: exact; -webkit-print-color-adjust: exact; }
  }
</style>
